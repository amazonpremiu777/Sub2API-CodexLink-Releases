name: Publish release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select release version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          else
            version="$(find release-assets -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -n 1)"
          fi
          test -n "${version}"
          echo "VERSION=${version}" >> "${GITHUB_ENV}"

      - name: Verify SHA256
        shell: bash
        run: |
          cd "release-assets/${VERSION}"
          expected="$(tr -d '\r\n ' < "Sub2API-CodexLink-${VERSION}.exe.sha256")"
          echo "${expected}  Sub2API-CodexLink-${VERSION}.exe" | sha256sum --check --strict

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          folder="release-assets/${VERSION}"
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            gh release upload "${VERSION}" \
              "${folder}/Sub2API-CodexLink-${VERSION}.exe" \
              "${folder}/Sub2API-CodexLink-${VERSION}.exe.sha256" \
              --clobber
          else
            gh release create "${VERSION}" \
              --title "Sub2API CodexLink ${VERSION}" \
              --notes-file "${folder}/RELEASE_NOTES.md" \
              "${folder}/Sub2API-CodexLink-${VERSION}.exe" \
              "${folder}/Sub2API-CodexLink-${VERSION}.exe.sha256"
          fi
