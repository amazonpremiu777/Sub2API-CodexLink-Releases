name: Publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify SHA256
        shell: bash
        run: |
          cd "release-assets/${GITHUB_REF_NAME}"
          expected="$(tr -d '\r\n ' < "Sub2API-CodexLink-${GITHUB_REF_NAME}.exe.sha256")"
          echo "${expected}  Sub2API-CodexLink-${GITHUB_REF_NAME}.exe" | sha256sum --check --strict

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          folder="release-assets/${GITHUB_REF_NAME}"
          gh release create "${GITHUB_REF_NAME}" \
            --title "Sub2API CodexLink ${GITHUB_REF_NAME}" \
            --notes-file "${folder}/RELEASE_NOTES.md" \
            "${folder}/Sub2API-CodexLink-${GITHUB_REF_NAME}.exe" \
            "${folder}/Sub2API-CodexLink-${GITHUB_REF_NAME}.exe.sha256"
